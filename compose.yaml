services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: still
    ports:
      - "5432:5432"
    volumes:
      - still_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d still"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  still_pg:
